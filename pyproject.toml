[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ult-contracts"
version = "0.1.1"
description = "Scaffold workspace for contracts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=4"]

[project.scripts]
contracts-export = "contracts.export.__main__:main"
contracts-compat = "contracts.compat.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}

[tool.setuptools.package-data]
contracts = ["baselines/*/json_schema/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
