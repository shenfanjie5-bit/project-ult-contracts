[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ult-contracts"
version = "0.1.2"
description = "Single source of truth for project-ult cross-module contracts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
# Pure-pip dev tools — no network calls, offline-first per
# SUBPROJECT_TESTING_STANDARD.md §2.2. Used by the test-fast and smoke
# CI lanes. Never includes git+URL deps.
dev = [
    "pytest>=8",
    "pytest-cov>=4",
]
# Shared regression fixtures bundled with project-ult-audit-eval.
# Separate extra so the regression lane is the only place that pulls in a
# git+URL dependency. Pinned to a git tag so contracts CI doesn't drift
# with audit-eval main.
shared-fixtures = [
    # Pinned to v0.2.1 (real sha256 fixture hashes; sync with stage 2.2
    # follow-up so all 12 modules reference the same audit-eval tag).
    "project-ult-audit-eval @ git+https://github.com/shenfanjie5-bit/project-ult-audit-eval.git@v0.2.1",
]

[project.scripts]
contracts-export = "contracts.export.__main__:main"
contracts-compat = "contracts.compat.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}

[tool.setuptools.package-data]
contracts = ["baselines/*/json_schema/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
