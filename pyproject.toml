[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ult-contracts"
version = "0.1.2"
description = "Single source of truth for project-ult cross-module contracts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    # Shared regression fixtures bundled with project-ult-audit-eval.
    # Pinned to a git tag so contracts CI doesn't drift with audit-eval main.
    "project-ult-audit-eval @ git+https://github.com/shenfanjie5-bit/project-ult-audit-eval.git@v0.2.0",
]

[project.scripts]
contracts-export = "contracts.export.__main__:main"
contracts-compat = "contracts.compat.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}

[tool.setuptools.package-data]
contracts = ["baselines/*/json_schema/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
